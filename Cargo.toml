[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Keep individual features explicit: Bevy's 2d/ui presets also enable unused modules.
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "bevy_sprite_render",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_gizmos_render",
    "ui_picking",
    "keyboard",
    "mouse",
    "touch",
    "png",
    "x11",
    "wayland",
    "webgl2",
] }
bevy_asset_packer = { version = "0.5.0", default-features = false }
# Same as in Bevy
glam = "0.33"
ron = "0.12"
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
wasm-bindgen-futures = "0.4"
ewebsock = { version = "0.8", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Event", "FileList", "File"] }

rts_assets = { path = "crates/assets" }
rts_base = { path = "crates/base" }
rts_client = { path = "crates/client" }
rts_net = { path = "crates/net" }
rts_server = { path = "crates/server" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Bevy systems take `Res`, `Query`, etc. by value.
needless_pass_by_value = "allow"
# Too many arguments are OK for Bevy systems.
too_many_arguments = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
