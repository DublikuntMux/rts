[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_scene",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "bevy_sprite_render",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_clipboard",
    "bevy_gizmos_render",
    "ui_picking",
    "keyboard",
    "mouse",
    "touch",
    "png",
    "x11",
    "wayland",
    "webgl2",
] }
bevy_asset_packer = { version = "0.5.0", default-features = false }
# Keep vector types compatible with Bevy 0.20 (glam 0.33).
glam = "0.33.12"
ron = "0.12.2"
miniz_oxide = "0.9.1"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wasm-bindgen-futures = "0.4.79"
ewebsock = { version = "0.8.0", default-features = false }
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "Storage", "Blob", "BlobPropertyBag", "Url", "Event", "FileList", "File"] }

rts_assets = { path = "crates/assets" }
rts_base = { path = "crates/base" }
rts_client = { path = "crates/client" }
rts_net = { path = "crates/net" }
rts_server = { path = "crates/server" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
too_many_arguments = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
