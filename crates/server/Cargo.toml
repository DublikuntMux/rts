[package]
name = "rts_server"
description = "QUIC lobby and authoritative fixed-rate simulation server."
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rts-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rand = { workspace = true, features = ["sys_rng"] }
rts_base.workspace = true
rts_net = { workspace = true, features = ["quic"] }
thiserror.workspace = true
tokio.workspace = true
