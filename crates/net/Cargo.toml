[package]
name = "rts_net"
description = "Shared multiplayer protocol, compact binary framing, QUIC transport, turns, and replays."
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
quic = [
    "dep:bytes",
    "dep:glomar",
    "dep:glomar-rustls",
    "dep:quinn",
    "dep:quinn-proto",
    "dep:rcgen",
    "dep:rustls",
    "dep:tokio",
]

[dependencies]
rts_base.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
miniz_oxide.workspace = true
bytes = { workspace = true, optional = true }
glomar = { workspace = true, optional = true }
glomar-rustls = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
quinn-proto = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
