name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false
      deploy_web:
        description: "Deploy the web build to GitHub Pages"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and find the previous release
        id: meta
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 0.2.0 or 0.2.0-rc.1 (optionally prefixed with v)"
            exit 1
          fi

          tag="v$version"
          git fetch --force --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $tag already exists on another commit"
              exit 1
            fi
          fi

          # The newest earlier version tag is the previous release and the base
          # for the changelog. Merge commits are ignored when listing changes.
          previous=""
          while IFS= read -r candidate; do
            case "$candidate" in
              v[0-9]*) ;;
              *) continue ;;
            esac
            [ "$candidate" = "$tag" ] && continue
            previous="$candidate"
            break
          done < <(git tag --sort=-creatordate --merged HEAD)

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
        run: .github/scripts/changelog.sh "$TAG" "$PREVIOUS" release-notes.md
      - name: Append downloads
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
        run: |
          {
            printf '\n'
            printf '## Downloads\n\n'
            printf '| Platform | Asset |\n'
            printf '| --- | --- |\n'
            printf '| Linux (x86_64) | rts-linux-x86_64-%s.tar.gz |\n' "$TAG"
            printf '| Windows (x86_64) | rts-windows-x86_64-%s.zip |\n' "$TAG"
            printf '| macOS (universal) | rts-macos-universal-%s.zip |\n' "$TAG"
            printf '| Android | rts-android-%s.apk |\n' "$TAG"
            printf '| Web | rts-web-%s.zip |\n\n' "$TAG"
            if [ "$DEPLOY_WEB" = "true" ]; then
              printf 'The web build is also published to GitHub Pages.\n\n'
            fi
            printf '## Notes\n\n'
            printf -- '- Keep assets.pack next to rts in the desktop and macOS builds; the game opens it beside the executable.\n'
            printf -- '- macOS builds are ad-hoc signed. On first launch, right-click **RTS.app** and choose **Open**.\n'
            printf -- '- Android APK file use the debug signing key.\n'
          } >> release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: release-notes.md
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose the GitHub Pages base path
        id: pages
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "$owner.github.io" ]; then
            public_url="/"
          else
            public_url="/$repo/"
          fi
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Cache Trunk tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-
      - name: Build the web bundle
        run: trunk build --release --public-url "${{ steps.pages.outputs.public_url }}"
      - name: Package the web bundle
        run: |
          set -euo pipefail
          test -f dist/assets.pack
          cd dist
          zip -qr "../rts-web-${TAG}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: rts-web
          path: rts-web-*.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: ${{ inputs.deploy_web }}
        with:
          path: dist

  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: [web, release]
    if: ${{ inputs.deploy_web }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            targets: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            targets: ""
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-on-failure: true
      - name: Build (Linux and Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --locked --release --workspace --target "$TARGET"
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --workspace --target aarch64-apple-darwin
          cargo build --locked --release --workspace --target x86_64-apple-darwin
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          stage="rts-linux-x86_64-${TAG}"
          mkdir -p "$stage"
          cp "target/${TARGET}/release/rts" "$stage/"
          cp "target/${TARGET}/release/rts-server" "$stage/"
          cp "target/${TARGET}/release/assets.pack" "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "rts-windows-x86_64-$env:TAG"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/rts.exe" $stage
          Copy-Item "target/$env:TARGET/release/rts-server.exe" $stage
          Copy-Item "target/$env:TARGET/release/assets.pack" $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arm=aarch64-apple-darwin
          intel=x86_64-apple-darwin
          stage="rts-macos-universal-${TAG}"
          app="$stage/RTS.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/rts" \
            "target/$arm/release/rts" "target/$intel/release/rts"
          lipo -create -output "$stage/rts-server" \
            "target/$arm/release/rts-server" "target/$intel/release/rts-server"
          cp "target/$arm/release/assets.pack" "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>RTS</string>
            <key>CFBundleDisplayName</key>
            <string>RTS</string>
            <key>CFBundleIdentifier</key>
            <string>cudzinec.rts</string>
            <key>CFBundleExecutable</key>
            <string>rts</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.strategy-games</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$app"
          codesign --force --sign - "$stage/rts-server"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$stage.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: rts-${{ matrix.name }}
          path: rts-${{ matrix.name }}-${{ needs.prepare.outputs.tag }}.*
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 90
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Cache the Android SDK packages
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/30.0.16248370
            /usr/local/lib/android/sdk/platforms/android-37.2
            /usr/local/lib/android/sdk/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-37.2-ndk-30.0.16248370
      - name: Install the Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="${{ github.run_number }}"
      - name: Package the Android builds
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "rts-android-${TAG}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: rts-android
          path: rts-android-${{ needs.prepare.outputs.tag }}.*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [prepare, web, desktop, android]
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rts-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: release-notes
      - name: Verify the assets and add the changelog
        run: |
          set -euo pipefail
          for asset in \
            "rts-linux-x86_64-${TAG}.tar.gz" \
            "rts-windows-x86_64-${TAG}.zip" \
            "rts-macos-universal-${TAG}.zip" \
            "rts-android-${TAG}.apk" \
            "rts-web-${TAG}.zip"; do
            if [ ! -s "release-assets/$asset" ]; then
              echo "::error::missing release asset: $asset"
              exit 1
            fi
          done
          cp release-notes/release-notes.md release-assets/CHANGELOG.md
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RTS ${{ needs.prepare.outputs.tag }}
          body_path: release-notes/release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
